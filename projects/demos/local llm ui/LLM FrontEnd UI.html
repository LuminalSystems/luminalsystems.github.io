<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMINAL // LOCAL ENGINE</title>
  <style>
    :root {
      --bg: #090b10;
      --panel: #11151c;
      --accent: #00e5ff;
      --text: #e2e8f0;
      --muted: #64748b;
      --border: #1e293b;
      --user-msg: #1a2332;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'JetBrains Mono', monospace, system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    
    header {
      padding: 1rem;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand { font-weight: bold; letter-spacing: 2px; color: var(--accent); font-size: 0.9rem; }
    .status { font-size: 0.75rem; color: #10b981; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; box-shadow: 0 0 8px #10b981; }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .msg { max-width: 85%; padding: 1rem; border-radius: 4px; line-height: 1.5; font-size: 0.95rem; }
    .msg.user { align-self: flex-end; background: var(--user-msg); border: 1px solid #2a364f; border-left: 3px solid var(--accent); }
    .msg.assistant { align-self: flex-start; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid #3b82f6; }
    .meta { font-size: 0.7rem; color: var(--muted); margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 1px; }

    footer { padding: 1rem; background: var(--panel); border-top: 1px solid var(--border); }
    .input-wrapper { display: flex; gap: 0.5rem; }
    input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.8rem 1rem;
      border-radius: 4px;
      outline: none;
    }
    input:focus { border-color: var(--accent); }
    button {
      background: var(--accent);
      color: #000;
      border: none;
      padding: 0 1.5rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>

  <header>
    <div class="brand">LUMINAL SYSTEMS // INFERENCE ENGINE</div>
    <div class="status"><div class="dot"></div> LOCALHOST:11434</div>
  </header>

  <div id="chat-container">
    <div class="msg assistant">
      <div class="meta">SYSTEM // READY</div>
      Local zero-dependency context pipeline established. Model target loaded. State: Offline [Airplane Mode Compatible].
    </div>
  </div>

  <footer>
    <form class="input-wrapper" id="chat-form">
      <input type="text" id="user-input" placeholder="Execute prompt..." autocomplete="off">
      <button type="submit">SEND</button>
    </form>
  </footer>

  <script>
    const chatContainer = document.getElementById('chat-container');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('user-input');

    let history = [
      { role: "system", content: "You are a concise, highly analytical technical assistant running inside a zero-dependency local environment." }
    ];

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      // Render User Message
      appendMessage('user', text);
      input.value = '';
      history.push({ role: "user", content: text });

      // Create Assistant Placeholder
      const assistantCard = appendMessage('assistant', 'Thinking...');
      
      try {
        const response = await fetch('http://127.0.0.1:11434/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'qwen2.5:1.5b',
            messages: history,
            stream: false
          })
        });

        const data = await response.json();
        const reply = data.message.content;
        
        assistantCard.querySelector('.text').innerText = reply;
        history.push({ role: "assistant", content: reply });
      } catch (err) {
        assistantCard.querySelector('.text').innerText = "[ERROR] Engine offline or connection refused. Verify Ollama server in Termux.";
      }
    });

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.className = `msg ${role}`;
      msgDiv.innerHTML = `<div class="meta">${role.toUpperCase()}</div><div class="text">${text}</div>`;
      chatContainer.appendChild(msgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return msgDiv;
    }
  </script>
</body>
</html>
