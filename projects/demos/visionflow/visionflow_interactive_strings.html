<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VisionFlow - Interactive Cat's Cradle</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <!-- MediaPipe Hands dependencies -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    /* Custom Styles & Glassmorphism */
    body {
      background-color: #08090d;
      color: #e2e8f0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    .glass-panel {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Pulse animation for active indicators */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.1); }
    }

    .pulse-active {
      animation: pulse-glow 2s infinite ease-in-out;
    }

    /* Video feed - Mirrored and hidden behind main canvas */
    #webcam {
      transform: scaleX(-1);
      display: none;
    }

    /* Main canvas covering viewport */
    #renderCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
    }

    /* Custom Switch Styling */
    .toggle-checkbox:checked {
      right: 0;
      border-color: #06b6d4;
    }
    .toggle-checkbox:checked + .toggle-label {
      background-color: #06b6d4;
    }
  </style>
</head>
<body class="relative w-screen h-screen flex flex-col justify-between p-4 md:p-6">

  <!-- Hidden HTML5 Video element for MediaPipe stream -->
  <video id="webcam" playsinline></video>

  <!-- High-Performance Interactive Canvas -->
  <canvas id="renderCanvas"></canvas>

  <!-- TOP HUD: Title & System Controls -->
  <header class="relative z-10 flex justify-between items-center w-full max-w-7xl mx-auto">
    <div class="glass-panel px-5 py-3 rounded-2xl flex items-center space-x-3">
      <div class="w-3 h-3 rounded-full bg-cyan-400 pulse-active shadow-[0_0_10px_#06b6d4]"></div>
      <h1 class="text-xl font-bold tracking-wider bg-gradient-to-r from-cyan-400 via-fuchsia-500 to-yellow-400 bg-clip-text text-transparent">
        VISION<span class="font-light text-slate-100">FLOW</span>
      </h1>
      <span class="text-xs px-2 py-0.5 rounded bg-cyan-950/80 text-cyan-400 border border-cyan-800/50 font-mono">v1.0</span>
    </div>

    <!-- Quick Action Controls -->
    <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center space-x-4">
      <button id="toggleCameraBtn" class="flex items-center space-x-2 text-sm text-slate-300 hover:text-cyan-400 transition-colors">
        <i class="fa-solid fa-video text-cyan-400"></i>
        <span id="cameraBtnText" class="hidden sm:inline">Camera: ON</span>
      </button>
      <div class="h-4 w-px bg-slate-700"></div>
      <button id="toggleSimulationBtn" class="flex items-center space-x-2 text-sm text-slate-300 hover:text-fuchsia-400 transition-colors">
        <i class="fa-solid fa-robot text-fuchsia-400"></i>
        <span id="simBtnText" class="hidden sm:inline">Demo Mode</span>
      </button>
    </div>
  </header>

  <!-- MIDDLE DISPLAY: Webcam Permission / Standby Banner (Shown if camera blocked or pending) -->
  <div id="statusBanner" class="relative z-10 max-w-md mx-auto my-auto text-center glass-panel p-6 rounded-3xl transition-opacity duration-500">
    <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-center text-cyan-400 text-2xl">
      <i class="fa-solid fa-hand-sparkles"></i>
    </div>
    <h2 class="text-lg font-semibold text-white mb-2">Webcam Hand Tracking</h2>
    <p class="text-sm text-slate-400 mb-6 leading-relaxed">
      VisionFlow uses your device webcam locally to detect hands and render real-time elastic Cat's Cradle line physics.
    </p>
    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button id="startWebcamBtn" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white text-sm font-medium shadow-lg shadow-cyan-500/20 transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-camera"></i>
        <span>Enable Camera</span>
      </button>
      <button id="startDemoBtn" class="px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium border border-slate-700 transition-all flex items-center justify-center space-x-2">
        <i class="fa-solid fa-play"></i>
        <span>Run Demo Hands</span>
      </button>
    </div>
  </div>

  <!-- BOTTOM HUD: Telemetry & Controls -->
  <footer class="relative z-10 w-full max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
    
    <!-- Metrics Badge -->
    <div class="glass-panel px-5 py-3 rounded-2xl flex items-center space-x-6 text-xs text-slate-400 font-mono w-full md:w-auto justify-around md:justify-start">
      <div class="flex items-center space-x-2">
        <span class="text-slate-500">FPS:</span>
        <span id="fpsCounter" class="text-cyan-400 font-bold">00</span>
      </div>
      <div class="h-3 w-px bg-slate-700"></div>
      <div class="flex items-center space-x-2">
        <span class="text-slate-500">HANDS:</span>
        <span id="handsDetectedCount" class="text-fuchsia-400 font-bold">0 / 2</span>
      </div>
      <div class="h-3 w-px bg-slate-700"></div>
      <div class="flex items-center space-x-2">
        <span class="text-slate-500">STRINGS:</span>
        <span id="activeStringsCount" class="text-yellow-400 font-bold">0</span>
      </div>
    </div>

    <!-- Interactive Config Panel -->
    <div class="glass-panel px-5 py-3 rounded-2xl flex items-center space-x-6 text-xs w-full md:w-auto justify-around">
      <!-- Glow Effect Toggle -->
      <label class="flex items-center cursor-pointer space-x-2">
        <span class="text-slate-300 font-medium">Glow FX</span>
        <input type="checkbox" id="glowToggle" class="sr-only toggle-checkbox" checked />
        <div class="w-8 h-4 bg-slate-700 rounded-full transition-colors toggle-label relative">
          <div class="dot absolute left-0.5 top-0.5 bg-white w-3 h-3 rounded-full transition-transform"></div>
        </div>
      </label>

      <!-- Video Feed Overlay Toggle -->
      <label class="flex items-center cursor-pointer space-x-2">
        <span class="text-slate-300 font-medium">Camera Feed</span>
        <input type="checkbox" id="bgFeedToggle" class="sr-only toggle-checkbox" checked />
        <div class="w-8 h-4 bg-slate-700 rounded-full transition-colors toggle-label relative">
          <div class="dot absolute left-0.5 top-0.5 bg-white w-3 h-3 rounded-full transition-transform"></div>
        </div>
      </label>

      <!-- Connection Pattern Style -->
      <div class="flex items-center space-x-2">
        <span class="text-slate-300 font-medium">Pattern:</span>
        <select id="patternSelect" class="bg-slate-800 text-cyan-300 border border-slate-700 rounded-lg px-2 py-1 text-xs focus:outline-none focus:border-cyan-500">
          <option value="cradle">Cat's Cradle</option>
          <option value="web">Full Web</option>
          <option value="fingertips">Fingertip Mesh</option>
        </select>
      </div>
    </div>
  </footer>

  <!-- MAIN SCRIPT LOGIC -->
  <script>
    // --- APP STATE & CONSTANTS ---
    const state = {
      isWebcamActive: false,
      isSimulationMode: false,
      enableGlow: true,
      showBgFeed: true,
      patternStyle: 'cradle', // 'cradle', 'web', 'fingertips'
      fps: 0,
      frameCount: 0,
      lastFpsTime: performance.now(),
      handsData: [], // Stores normalized hand landmarks
      simAngle: 0
    };

    // Fingertip indices in MediaPipe Hands Model
    // 4: Thumb, 8: Index, 12: Middle, 16: Ring, 20: Pinky
    const FINGERTIP_INDICES = [4, 8, 12, 16, 20];
    const JOINT_CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],        // Thumb
      [0,5],[5,6],[6,7],[7,8],        // Index
      [9,10],[10,11],[11,12],         // Middle
      [13,14],[14,15],[15,16],       // Ring
      [0,17],[17,18],[18,19],[19,20],  // Pinky
      [5,9],[9,13],[13,17]            // Palm Base
    ];

    // Neon Palette
    const PALETTE = {
      cyan: '#06b6d4',
      magenta: '#d946ef',
      yellow: '#eab308',
      green: '#22c55e',
      blue: '#3b82f6'
    };

    // DOM Elements
    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('renderCanvas');
    const ctx = canvasElement.getContext('2d');
    const statusBanner = document.getElementById('statusBanner');
    const fpsCounter = document.getElementById('fpsCounter');
    const handsCountEl = document.getElementById('handsDetectedCount');
    const stringsCountEl = document.getElementById('activeStringsCount');
    const cameraBtnText = document.getElementById('cameraBtnText');
    const simBtnText = document.getElementById('simBtnText');

    // --- CANVAS RESIZING ---
    function resizeCanvas() {
      canvasElement.width = window.innerWidth;
      canvasElement.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // --- MEDIAPIPE HANDS SETUP ---
    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults(onHandResults);

    let cameraInstance = null;

    function initCamera() {
      cameraInstance = new Camera(videoElement, {
        onFrame: async () => {
          if (state.isWebcamActive) {
            await hands.send({ image: videoElement });
          }
        },
        width: 1280,
        height: 720
      });
      
      cameraInstance.start()
        .then(() => {
          state.isWebcamActive = true;
          state.isSimulationMode = false;
          statusBanner.style.opacity = '0';
          setTimeout(() => statusBanner.style.display = 'none', 500);
          cameraBtnText.textContent = 'Camera: ON';
        })
        .catch((err) => {
          console.warn('Webcam access denied or unavailable:', err);
          enableSimulationMode();
        });
    }

    // --- MEDIAPIPE RESULTS CALLBACK ---
    function onHandResults(results) {
      if (state.isSimulationMode) return; // Skip if demo active

      state.handsData = [];

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        for (let i = 0; i < results.multiHandLandmarks.length; i++) {
          const landmarks = results.multiHandLandmarks[i];
          const handedness = results.multiHandedness[i] ? results.multiHandedness[i].label : (i === 0 ? 'Left' : 'Right');
          
          // Map normalized (0-1) coordinates to screen dimensions with mirroring
          const screenPoints = landmarks.map(pt => ({
            x: (1 - pt.x) * canvasElement.width, // Mirrored horizontally
            y: pt.y * canvasElement.height,
            z: pt.z
          }));

          state.handsData.push({
            label: handedness,
            points: screenPoints
          });
        }
      }
    }

    // --- SIMULATION / DEMO MODE (Fallback when no webcam) ---
    function enableSimulationMode() {
      state.isWebcamActive = false;
      state.isSimulationMode = true;
      statusBanner.style.opacity = '0';
      setTimeout(() => statusBanner.style.display = 'none', 500);
      simBtnText.textContent = 'Demo: ACTIVE';
      cameraBtnText.textContent = 'Camera: OFF';
    }

    function generateSyntheticHands() {
      state.simAngle += 0.02;
      const cx = canvasElement.width / 2;
      const cy = canvasElement.height / 2;
      const radius = Math.min(canvasElement.width, canvasElement.height) * 0.22;

      // Left Hand Orbit
      const lx = cx - radius * 0.9 + Math.cos(state.simAngle) * 40;
      const ly = cy + Math.sin(state.simAngle * 1.3) * 50;

      // Right Hand Orbit
      const rx = cx + radius * 0.9 + Math.sin(state.simAngle * 0.9) * 40;
      const ry = cy + Math.cos(state.simAngle * 1.1) * 50;

      state.handsData = [
        { label: 'Left', points: createHandSkeletonPoints(lx, ly, -0.2 + Math.sin(state.simAngle)*0.1) },
        { label: 'Right', points: createHandSkeletonPoints(rx, ry, 0.2 - Math.sin(state.simAngle)*0.1) }
      ];
    }

    // Helper to generate a hand-shaped landmark layout for demo mode
    function createHandSkeletonPoints(baseX, baseY, tiltAngle) {
      const pts = [];
      const wrist = { x: baseX, y: baseY + 100 };
      pts[0] = wrist;

      const fingerAngles = [-0.6, -0.2, 0.1, 0.4, 0.7];
      const fingerLengths = [70, 100, 110, 100, 80];

      let ptIdx = 1;
      for (let f = 0; f < 5; f++) {
        const angle = tiltAngle + fingerAngles[f];
        const len = fingerLengths[f];
        
        for (let j = 1; j <= 4; j++) {
          const segLen = (len / 4) * j;
          pts[ptIdx] = {
            x: baseX + Math.sin(angle) * segLen + (j === 4 ? Math.sin(state.simAngle * 2 + f) * 10 : 0),
            y: baseY - Math.cos(angle) * segLen + (j === 4 ? Math.cos(state.simAngle * 2 + f) * 10 : 0)
          };
          ptIdx++;
        }
      }
      return pts;
    }

    // --- MAIN RENDER LOOP ---
    function render() {
      requestAnimationFrame(render);

      // Measure FPS
      const now = performance.now();
      state.frameCount++;
      if (now - state.lastFpsTime >= 1000) {
        state.fps = state.frameCount;
        state.frameCount = 0;
        state.lastFpsTime = now;
        fpsCounter.textContent = state.fps.toString().padStart(2, '0');
      }

      // Update synthetic hands if in demo mode
      if (state.isSimulationMode) {
        generateSyntheticHands();
      }

      // Clear Canvas
      ctx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      // Render Video Frame Background (If active & enabled)
      if (state.isWebcamActive && state.showBgFeed && videoElement.readyState >= 2) {
        ctx.save();
        ctx.globalAlpha = 0.25; // Dimmed background video feed
        ctx.translate(canvasElement.width, 0);
        ctx.scale(-1, 1); // Mirror video feed
        ctx.drawImage(videoElement, 0, 0, canvasElement.width, canvasElement.height);
        ctx.restore();
      }

      // Update UI Telemetry
      handsCountEl.textContent = `${state.handsData.length} / 2`;

      // Draw Hand Landmarks & Cat's Cradle Strings
      if (state.handsData.length > 0) {
        // 1. Draw Finger Joint Skeletons & Nodes
        state.handsData.forEach((hand, hIdx) => {
          drawHandSkeleton(hand, hIdx);
        });

        // 2. Draw Cat's Cradle Dynamic Strings between hands
        let stringCount = 0;
        if (state.handsData.length >= 2) {
          stringCount = drawCatsCradleStrings(state.handsData[0], state.handsData[1]);
        } else if (state.handsData.length === 1 && state.patternStyle === 'web') {
          // Single hand fallback web effect
          stringCount = drawSingleHandWeb(state.handsData[0]);
        }
        stringsCountEl.textContent = stringCount.toString();
      } else {
        stringsCountEl.textContent = '0';
      }
    }

    // --- DRAWING SKELETON & JOINTS ---
    function drawHandSkeleton(hand, handIndex) {
      const pts = hand.points;
      const baseColor = handIndex === 0 ? PALETTE.cyan : PALETTE.magenta;

      // Draw Joint Connectors
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(226, 232, 240, 0.3)';
      JOINT_CONNECTIONS.forEach(([i, j]) => {
        if (pts[i] && pts[j]) {
          ctx.beginPath();
          ctx.moveTo(pts[i].x, pts[i].y);
          ctx.lineTo(pts[j].x, pts[j].y);
          ctx.stroke();
        }
      });

      // Draw Glowing Joint Nodes
      pts.forEach((pt, idx) => {
        const isFingertip = FINGERTIP_INDICES.includes(idx);
        const radius = isFingertip ? 7 : 4;

        ctx.save();
        if (state.enableGlow) {
          ctx.shadowColor = isFingertip ? PALETTE.yellow : baseColor;
          ctx.shadowBlur = isFingertip ? 15 : 8;
        }

        ctx.fillStyle = isFingertip ? PALETTE.yellow : baseColor;
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, radius, 0, Math.PI * 2);
        ctx.fill();

        // Inner core light
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(pt.x, pt.y, radius * 0.4, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      });
    }

    // --- DRAW CAT'S CRADLE ELASTIC STRINGS ---
    function drawCatsCradleStrings(handA, handB) {
      let activeStrings = 0;

      const ptsA = handA.points;
      const ptsB = handB.points;

      // Extract Fingertips
      const tipsA = FINGERTIP_INDICES.map(idx => ptsA[idx]);
      const tipsB = FINGERTIP_INDICES.map(idx => ptsB[idx]);

      // Calculate Center Distance between hands to drive global elasticity
      const centerA = ptsA[0]; // Wrist
      const centerB = ptsB[0];
      const handDistance = Math.hypot(centerB.x - centerA.x, centerB.y - centerA.y);
      
      // Dynamic elastic sag factor based on proximity
      const maxDist = canvasElement.width * 0.6;
      const tension = Math.min(Math.max(handDistance / maxDist, 0.1), 1.0);
      const sagAmount = (1 - tension) * 120; // Lower distance = deeper Bezier sag

      ctx.save();

      // Render Connection Matrix depending on Selected Pattern
      if (state.patternStyle === 'cradle') {
        // Classic Cat's Cradle: Direct finger-to-opposite finger + criss-cross strings
        for (let i = 0; i < 5; i++) {
          for (let j = 0; j < 5; j++) {
            // Filter connections to make iconic string geometry
            if (i === j || Math.abs(i - j) === 1 || (i === 0 && j === 4) || (i === 4 && j === 0)) {
              renderElasticString(tipsA[i], tipsB[j], sagAmount, tension, activeStrings);
              activeStrings++;
            }
          }
        }
      } else if (state.patternStyle === 'web') {
        // Interconnected Full Geometric Mesh
        for (let i = 0; i < 5; i++) {
          for (let j = 0; j < 5; j++) {
            renderElasticString(tipsA[i], tipsB[j], sagAmount * 0.5, tension, activeStrings);
            activeStrings++;
          }
        }
      } else if (state.patternStyle === 'fingertips') {
        // Parallel Elastic Bands
        for (let i = 0; i < 5; i++) {
          renderElasticString(tipsA[i], tipsB[i], sagAmount, tension, activeStrings);
          activeStrings++;
        }
      }

      ctx.restore();
      return activeStrings;
    }

    // Single Hand Dynamic Web Fallback
    function drawSingleHandWeb(hand) {
      let count = 0;
      const tips = FINGERTIP_INDICES.map(idx => hand.points[idx]);
      ctx.save();
      for (let i = 0; i < tips.length; i++) {
        for (let j = i + 1; j < tips.length; j++) {
          renderElasticString(tips[i], tips[j], 30, 0.8, count);
          count++;
        }
      }
      ctx.restore();
      return count;
    }

    // Helper to render an individual elastic string with Bezier curves & neon glow
    function renderElasticString(p1, p2, sag, tension, stringIdx) {
      if (!p1 || !p2) return;

      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2 + sag; // Curve downwards to simulate gravity/elasticity

      const dist = Math.hypot(p2.x - p1.x, p2.y - p1.y);

      // Create Dynamic Gradient along the string
      const gradient = ctx.createLinearGradient(p1.x, p1.y, p2.x, p2.y);
      if (stringIdx % 3 === 0) {
        gradient.addColorStop(0, PALETTE.cyan);
        gradient.addColorStop(0.5, PALETTE.magenta);
        gradient.addColorStop(1, PALETTE.yellow);
      } else if (stringIdx % 3 === 1) {
        gradient.addColorStop(0, PALETTE.magenta);
        gradient.addColorStop(0.5, PALETTE.yellow);
        gradient.addColorStop(1, PALETTE.green);
      } else {
        gradient.addColorStop(0, PALETTE.yellow);
        gradient.addColorStop(0.5, PALETTE.cyan);
        gradient.addColorStop(1, PALETTE.blue);
      }

      // High Tension = Thinner line, Low Tension = Thicker slack line
      const lineWidth = Math.max(1, (1 - tension * 0.5) * 3.5);

      if (state.enableGlow) {
        ctx.shadowColor = (stringIdx % 2 === 0) ? PALETTE.cyan : PALETTE.magenta;
        ctx.shadowBlur = 10 + tension * 8;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.quadraticCurveTo(midX, midY, p2.x, p2.y);
      ctx.strokeStyle = gradient;
      ctx.lineWidth = lineWidth;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // --- EVENT LISTENERS & UI INTERACTION ---
    document.getElementById('startWebcamBtn').addEventListener('click', () => {
      initCamera();
    });

    document.getElementById('startDemoBtn').addEventListener('click', () => {
      enableSimulationMode();
    });

    document.getElementById('toggleCameraBtn').addEventListener('click', () => {
      if (state.isWebcamActive) {
        state.isWebcamActive = false;
        cameraBtnText.textContent = 'Camera: OFF';
      } else {
        initCamera();
      }
    });

    document.getElementById('toggleSimulationBtn').addEventListener('click', () => {
      if (state.isSimulationMode) {
        state.isSimulationMode = false;
        simBtnText.textContent = 'Demo Mode';
      } else {
        enableSimulationMode();
      }
    });

    // Toggles
    document.getElementById('glowToggle').addEventListener('change', (e) => {
      state.enableGlow = e.target.checked;
      const dot = e.target.nextElementSibling.querySelector('.dot');
      dot.style.transform = e.target.checked ? 'translateX(100%)' : 'translateX(0)';
    });

    document.getElementById('bgFeedToggle').addEventListener('change', (e) => {
      state.showBgFeed = e.target.checked;
      const dot = e.target.nextElementSibling.querySelector('.dot');
      dot.style.transform = e.target.checked ? 'translateX(100%)' : 'translateX(0)';
    });

    document.getElementById('patternSelect').addEventListener('change', (e) => {
      state.patternStyle = e.value || e.target.value;
    });

    // Start render loop immediately
    requestAnimationFrame(render);
  </script>
</body>
</html>
